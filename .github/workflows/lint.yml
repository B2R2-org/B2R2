name: lint

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  linting:

    # A branch of this repository is already checked by its push, so its pull
    # request skips the run; a fork's pull request is the only run it gets.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 11.0.x
    - name: Lint files
      run: |
        dotnet tool restore
        dotnet fslint src --strict
        dotnet fslint scripts --strict

  notify-failure:

    needs: linting
    if: failure()

    uses: ./.github/workflows/notify-failure.yml
    secrets: inherit
